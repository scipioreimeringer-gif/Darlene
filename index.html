<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darlene oefent Nederlands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#1F4E5F;--coral:#E07A5F;--green:#3D9970;--red:#C0392B;--bg:#F6F8F9;--card:#fff;--tint:#EEF4F5;--peach:#FDF1EC;--ink:#1E2A32;--muted:#5E6E76;--line:#DCE4E7}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
header{background:var(--teal);color:#fff;padding:26px 20px 18px}
header h1{font-family:"DM Serif Display",serif;font-weight:400;font-size:30px;margin:0 0 4px}
header p{margin:0;opacity:.85;font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;scrollbar-width:thin}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
nav button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
nav button .new{font-size:10px;font-weight:700;background:var(--coral);color:#fff;border-radius:999px;padding:1px 6px;margin-left:5px;vertical-align:1px}
main{max-width:780px;margin:0 auto;padding:20px 16px 60px}
section{display:none}section.on{display:block}
h2{font-family:"DM Serif Display",serif;font-weight:400;font-size:26px;color:var(--teal);margin:4px 0 6px}
h3{font-size:16px;margin:18px 0 8px;color:var(--teal)}
.intro{color:var(--muted);margin:0 0 16px;font-size:15px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.rule{background:var(--tint);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:15px}
.rule b{color:var(--teal)}
.score{display:inline-block;background:var(--peach);color:var(--coral);font-weight:700;border-radius:999px;padding:4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--teal);color:#fff;padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.btn.coral{background:var(--coral)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--teal);color:#fff}
/* home */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.tile-card:hover{border-color:var(--teal)}
.tile-card .t{font-weight:700;font-size:16px;margin-bottom:4px}
.tile-card .d{font-size:13px;color:var(--muted);margin-bottom:10px}
.bar{height:6px;background:var(--tint);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.lesson{font-size:11px;font-weight:700;color:var(--coral);letter-spacing:.04em;text-transform:uppercase}
/* flashcards */
.flash{perspective:900px;height:220px;margin:6px 0 14px;cursor:pointer}
.flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.front{background:var(--teal);color:#fff}
.back{background:var(--peach);color:var(--ink);transform:rotateY(180deg)}
.face .w{font-family:"DM Serif Display",serif;font-size:34px}
.face .s{font-size:14px;opacity:.8;margin-top:6px}
.meta{color:var(--muted);font-size:14px}
/* quiz items */
.q{padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .p{margin-bottom:8px}
.q input[type=text]{font:inherit;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;width:100%;max-width:340px;background:#fff}
input.ok,select.ok{border-color:var(--green)!important;background:#EAF6F0!important}
input.bad,select.bad{border-color:var(--red)!important;background:#FBECEA!important}
.fb{font-size:14px;margin-top:6px;min-height:1em}
.fb.ok{color:var(--green)}.fb.bad{color:var(--red)}
.choice{border:1.5px solid var(--line);background:#fff;padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer;margin:0 6px 6px 0;text-align:left}
.choice.ok{border-color:var(--green);background:#EAF6F0;color:var(--green);font-weight:600}
.choice.bad{border-color:var(--red);background:#FBECEA;color:var(--red)}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.vgrid label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.vgrid input,.vgrid select{font:inherit;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;width:100%;background:#fff}
.big{font-family:"DM Serif Display",serif;font-size:34px;color:var(--teal)}
.huge{font-family:"DM Serif Display",serif;font-size:44px;color:var(--teal);text-align:center;margin:10px 0}
/* tiles */
.slot{min-height:54px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;background:#fff}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tile{border:0;background:var(--tint);color:var(--ink);padding:8px 12px;border-radius:9px;font:inherit;font-weight:500;cursor:pointer}
.slot .tile{background:var(--teal);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--teal);margin-right:6px}
.tag.c{background:var(--peach);color:var(--coral)}
table.ref{border-collapse:collapse;width:100%;font-size:14px}
table.ref th{background:var(--teal);color:#fff;text-align:left;padding:7px 9px}
table.ref td{padding:7px 9px;border-bottom:1px solid var(--line)}
table.ref tr:nth-child(even) td{background:var(--tint)}
.kof{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.kof span{width:36px;height:36px;border-radius:9px;background:var(--peach);color:var(--coral);font-weight:700;display:flex;align-items:center;justify-content:center}
@media(max-width:560px){.vgrid{grid-template-columns:1fr}.face .w{font-size:28px}.grid{grid-template-columns:1fr}}
</style>
</head>

function stemOf(inf){let st=inf.replace(/en$/,"").replace(/n$/,"");if(/([^aeiou])\1$/.test(st))st=st.slice(0,-1);return st}
function wrongForms(v,kind){
  const [inf,vt,vtm,vd]=v,st=stemOf(inf),out=[];
  const sw=(x,a,b)=>x.endsWith(a)?x.slice(0,-a.length)+b:null;
  if(kind==="vt"){out.push(sw(vt,"te","de"),sw(vt,"de","te"),st+"de",st+"te",vtm,vd)}
  if(kind==="vtm"){out.push(sw(vtm,"ten","den"),sw(vtm,"den","ten"),vt,st+"den",st+"ten")}
  if(kind==="vd"){out.push(sw(vd,"t","d"),sw(vd,"d","t"),"ge"+st+"d","ge"+st+"t",vd.startsWith("ge")?vd.slice(2):"ge"+vd,vt)}
  const correct={vt,vtm,vd}[kind];
  let c=[...new Set(out.filter(x=>x&&x!==correct&&x.length>1))];
  c=shuffle(c).slice(0,2);
  while(c.length<2){const o=VERBS[Math.floor(Math.random()*VERBS.length)];const f={vt:o[1],vtm:o[2],vd:o[3]}[kind];if(f!==correct&&!c.includes(f))c.push(f)}
  return {correct,opts:shuffle([correct,...c])};
}

function mcList(box,sc,items){

function typedList(box,sc,data){

    let scored=false,tries=0;

    b.onclick=check;inp.addEventListener("keydown",e=>{if(e.key==="Enter")check()});

  const $=k=>root.querySelector(`[data-r="${k}"]`);
  const face=(b,open)=>{b.textContent=open?b.dataset.t:"?";b.style.background=open?"#fff":"var(--teal)";b.style.color=open?"var(--ink)":"#fff"};
  const deal=()=>{
    first=null;lock=false;found=0;moves=0;$("fb").textContent="";$("sc").textContent="0 beurten";

        if(lock||b.dataset.done||b===first)return;
        face(b,true);
        if(!first){first=b;return}
        moves++;$("sc").textContent=`${moves} ${moves===1?"beurt":"beurten"}`;const a=first;first=null;

    });
  };

  const g=el("div",{class:"grid"});
  SECTIONS.filter(s=>s.id!=="start").forEach(s=>{
    const pct=best[s.id]||0;
    const c=el("button",{class:"tile-card",on:{click:()=>{location.hash=s.id}}},`<div class="lesson">${s.l}${s.nw?" · nieuw":""}</div><div class="t">${s.label}</div><div class="d">${s.d}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="meta" style="margin-top:4px;font-size:12px">${pct?`beste score: ${pct}%`:"nog niet gedaan"}</div>`);
    g.appendChild(c);
  });
  root.appendChild(g);
}

/* ---------- flashcards ---------- */
function buildFlash(root){
  let les=0,deck,i=0,dir="nl",known=0;
  root.innerHTML=`<h2>Woorden</h2><p class="intro">Klik op de kaart om hem om te draaien. Weet je het? Klik op <b>Ik weet het</b>.</p>
  <div class="row" style="margin-bottom:10px"><div class="seg" id="fles"><button data-l="0" class="on">Alle</button><button data-l="1">Les 1</button><button data-l="2">Les 2</button><button data-l="3">Les 3</button></div><button class="btn alt" id="fdir">NL → EN</button><span class="score" id="fscore"></span></div>
  <div class="flash" id="fcard"><div class="in"><div class="face front"><div class="w" id="ff"></div><div class="s" id="ffs"></div></div><div class="face back"><div class="w" id="fb"></div><div class="s">klik om terug te draaien</div></div></div></div>
  <div class="row"><button class="btn coral" id="fno">Nog niet</button><button class="btn" id="fyes">Ik weet het</button><span class="meta" id="fpos"></span></div>`;
  const card=root.querySelector("#fcard");
  const reset=()=>{deck=shuffle(WORDS.filter(w=>!les||w[2]===les));i=0;known=0;render()};
  const render=()=>{
    if(i>=deck.length){card.classList.remove("flip");root.querySelector("#ff").textContent="Klaar!";root.querySelector("#ffs").textContent=`Je wist ${known} woorden meteen. Kies opnieuw een les om verder te gaan.`;root.querySelector("#fb").textContent="";root.querySelector("#fpos").textContent="";return}
    const [nl,en]=deck[i];card.classList.remove("flip");
    root.querySelector("#ff").textContent=dir==="nl"?nl:en;root.querySelector("#ffs").textContent=dir==="nl"?"Wat betekent dit?":"Hoe zeg je dit in het Nederlands? (met de/het)";
    setTimeout(()=>{root.querySelector("#fb").textContent=dir==="nl"?en:nl},200);
    root.querySelector("#fpos").textContent=`nog ${deck.length-i} kaarten`;root.querySelector("#fscore").textContent=`${known} geweten`;
  };
  card.onclick=()=>card.classList.toggle("flip");
  root.querySelector("#fyes").onclick=()=>{if(i<deck.length){known++;i++;saveBest("woorden",known,WORDS.filter(w=>!les||w[2]===les).length);render()}};
  root.querySelector("#fno").onclick=()=>{if(i<deck.length){deck.push(deck[i]);i++;render()}};
  root.querySelectorAll("#fles button").forEach(b=>b.onclick=()=>{les=+b.dataset.l;root.querySelectorAll("#fles button").forEach(x=>x.classList.toggle("on",x===b));reset()});
  root.querySelector("#fdir").onclick=e=>{dir=dir==="nl"?"en":"nl";e.target.textContent=dir==="nl"?"NL → EN":"EN → NL";render()};
  reset();
}

/* ---------- 't kofschip ---------- */
function buildKof(root){
  const regs=VERBS.filter(v=>v[6]==="R");
  let deck=shuffle(regs),i=0,good=0,done=0,streak=0,answered=false;
  root.innerHTML=`<h2>'t kofschip</h2><p class="intro">Regelmatige werkwoorden: krijgt de verleden tijd <b>-te</b> of <b>-de</b>?</p>
  <div class="rule">Zoek de stam (werkwoord min -en). Is de laatste letter een van deze? Dan <b>-te</b> en <b>-t</b>. Anders <b>-de</b> en <b>-d</b>.<div class="kof">${["t","k","f","s","ch","p"].map(x=>`<span>${x}</span>`).join("")}</div>Let op: <b>v en z</b> tellen niet: leven → leefde, verhuizen → verhuisde.</div>
  <div class="box" style="text-align:center"><div class="row" style="justify-content:space-between"><span class="score" id="ks"></span><span class="meta" id="kstreak"></span></div>
  <div class="huge" id="kv"></div><div class="meta" id="ken"></div>
  <div class="row" style="justify-content:center;margin:16px 0 6px"><button class="btn" style="min-width:110px;font-size:18px" data-a="te">-te</button><button class="btn coral" style="min-width:110px;font-size:18px" data-a="de">-de</button></div>
  <div class="fb" id="kfb" style="font-size:16px"></div><button class="btn alt" id="knext" style="margin-top:10px">Volgende</button></div>`;
  const ending=v=>v[1].endsWith("te")?"te":"de";
  const render=()=>{if(i>=deck.length){deck=shuffle(regs);i=0}answered=false;const v=deck[i];root.querySelector("#kv").textContent=v[0];root.querySelector("#ken").textContent=v[5];root.querySelector("#kfb").textContent="";root.querySelector("#kfb").className="fb";root.querySelector("#ks").textContent=`${good} van ${done} goed`;root.querySelector("#kstreak").textContent=streak>1?`${streak} op rij!`:""};
  root.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(answered)return;answered=true;done++;const v=deck[i];const ok=b.dataset.a===ending(v);if(ok){good++;streak++}else streak=0;
    const fb=root.querySelector("#kfb");fb.innerHTML=`${ok?"Goed!":"Niet goed."} ik <b>${v[1]}</b> · wij <b>${v[2]}</b> · ${v[4]==="h"?"heb":"ben"} <b>${v[3]}</b>`;fb.className="fb "+(ok?"ok":"bad");
    root.querySelector("#ks").textContent=`${good} van ${done} goed`;root.querySelector("#kstreak").textContent=streak>1?`${streak} op rij!`:"";if(done>=10)saveBest("kofschip",good,done)});
  root.querySelector("#knext").onclick=()=>{i++;render()};
  render();
}

/* ---------- werkwoorden ---------- */
function buildVerbs(root){
  let filter="all",deck,i=0,good=0,done=0,checked=false;
  root.innerHTML=`<h2>Werkwoorden</h2><p class="intro">Typ de verleden tijd (ik en wij), het voltooid deelwoord, en kies hebben of zijn. ${VERBS.length} werkwoorden.</p>
  <div class="row" style="margin-bottom:12px"><div class="seg" id="vf"><button data-f="all" class="on">Alle</button><button data-f="R">Regelmatig</button><button data-f="S">Sterk</button></div><button class="btn alt" id="vtab">Toon de tabel</button></div>
  <div id="vtable" style="display:none" class="box"></div>
  <div class="box"><div class="row" style="justify-content:space-between"><div><div class="big" id="vinf"></div><div class="meta" id="ven"></div></div><span class="score" id="vscore"></span></div>
  <div class="vgrid"><div><label>verleden tijd: ik</label><input id="v1" autocomplete="off" autocapitalize="off"></div><div><label>verleden tijd: wij</label><input id="v2" autocomplete="off" autocapitalize="off"></div><div><label>voltooid deelwoord</label><input id="v3" autocomplete="off" autocapitalize="off"></div></div>
  <div class="vgrid"><div><label>hebben of zijn?</label><select id="v4"><option value="">kies…</option><option value="h">hebben</option><option value="z">zijn</option></select></div></div>
  <div class="fb" id="vfb"></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="vcheck">Controleer</button><button class="btn alt" id="vnext">Volgende</button></div></div>`;
  const ids=["v1","v2","v3","v4"].map(x=>root.querySelector("#"+x));
  const pool=()=>VERBS.filter(v=>filter==="all"||v[6]===filter);
  const reset=()=>{deck=shuffle(pool());i=0;render()};
  const render=()=>{
    if(i>=deck.length){deck=shuffle(pool());i=0}
    const v=deck[i];checked=false;root.querySelector("#vinf").textContent=v[0];root.querySelector("#ven").textContent=v[5]+(v[6]==="S"?" · sterk":" · regelmatig");
    ids.forEach(x=>{x.value="";x.classList.remove("ok","bad")});root.querySelector("#vfb").textContent="";root.querySelector("#vfb").className="fb";
    root.querySelector("#vscore").textContent=`${good} van ${done} goed`;ids[0].focus({preventScroll:true});
  };
  root.querySelector("#vcheck").onclick=()=>{
    const v=deck[i];const ans=[v[1],v[2],v[3],v[4]];let all=true;
    ids.forEach((x,k)=>{const ok=norm(x.value)===ans[k];x.classList.toggle("ok",ok);x.classList.toggle("bad",!ok);if(!ok)all=false});
    const fb=root.querySelector("#vfb");
    if(all){fb.textContent="Helemaal goed!";fb.className="fb ok"}else{fb.innerHTML=`Goed is: ik <b>${v[1]}</b> · wij <b>${v[2]}</b> · <b>${v[4]==="h"?"heb":"ben"} ${v[3]}</b>`;fb.className="fb bad"}
    if(!checked){done++;if(all)good++;checked=true;if(done>=5)saveBest("werkwoorden",good,done)}
    root.querySelector("#vscore").textContent=`${good} van ${done} goed`;
  };
  root.querySelector("#vnext").onclick=()=>{i++;render()};
  ids.forEach(x=>x.addEventListener("keydown",e=>{if(e.key==="Enter")root.querySelector("#vcheck").click()}));
  root.querySelectorAll("#vf button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;root.querySelectorAll("#vf button").forEach(x=>x.classList.toggle("on",x===b));reset()});
  const tb=root.querySelector("#vtable");
  root.querySelector("#vtab").onclick=e=>{const open=tb.style.display==="none";tb.style.display=open?"block":"none";e.target.textContent=open?"Verberg de tabel":"Toon de tabel";
    if(open)tb.innerHTML=`<table class="ref"><tr><th>Werkwoord</th><th>Verleden tijd</th><th>Voltooid deelwoord</th></tr>${VERBS.filter(v=>v[6]==="S").map(v=>`<tr><td><b>${v[0]}</b></td><td>${v[1]} / ${v[2]}</td><td>${v[4]==="h"?"heeft":"is"} ${v[3]}</td></tr>`).join("")}</table>`};
  reset();
}

/* ---------- choice lists ---------- */
function choiceList(root,id,data,opts){
  const sc=scoreLine(root,id,data.length);const box=el("div",{class:"box"});root.appendChild(box);
  data.forEach(([p,a])=>{
    const q=el("div",{class:"q"});q.appendChild(el("div",{class:"p"},p.replace("___","<b>___</b>")));
    const o=el("div");let answered=false,first=true;
    opts.forEach(x=>{const b=el("button",{class:"choice"},x);b.onclick=()=>{if(answered)return;const ok=x.toLowerCase()===a.toLowerCase();b.classList.add(ok?"ok":"bad");if(ok){answered=true;if(first)sc.hit()}first=false};o.appendChild(b)});
    q.appendChild(o);box.appendChild(q);
  });
}
function buildHZ(root){root.innerHTML=`<h2>Hebben of zijn?</h2><p class="intro">Klik op de goede vorm.</p><div class="rule"><b>Bijna altijd hebben.</b> Zijn bij een verandering van plaats of situatie: zijn (geweest), gaan, komen, blijven, worden, beginnen, vertrekken, verhuizen.</div>`;choiceList(root,"hebben-zijn",HZ,HZOPTS)}
function buildVW(root){root.innerHTML=`<h2>Voegwoorden</h2><p class="intro">Kies het goede voegwoord. Kijk goed waar het werkwoord staat!</p>
  <div class="rule"><span class="tag">nevenschikkend</span> en, maar, of, want, dus: <b>niets verandert</b>. <i>Ik kom niet, want ik ben ziek.</i><br><span class="tag c">onderschikkend</span> omdat, als, dat, wanneer, toen: <b>werkwoord naar het eind</b>. <i>Ik kom niet, omdat ik ziek ben.</i></div>`;choiceList(root,"voegwoorden",VW,VWOPTS)}

/* ---------- typing ---------- */
function buildType(root,id,data,title,intro,rule){
  root.innerHTML=`<h2>${title}</h2><p class="intro">${intro}</p><div class="rule">${rule}</div>`;
  const sc=scoreLine(root,id,data.length);const box=el("div",{class:"box"});root.appendChild(box);
  data.forEach(([p,a])=>{
    const q=el("div",{class:"q"});q.appendChild(el("div",{class:"p"},p.replace("___","<b>___</b>")));
    const row=el("div",{class:"row"});const inp=el("input",{type:"text",autocomplete:"off",autocapitalize:"off"});const b=el("button",{class:"btn alt"},"Check");const fb=el("div",{class:"fb"});
    let scored=false,tries=0;
    const check=()=>{const ok=norm(inp.value)===norm(a);inp.classList.toggle("ok",ok);inp.classList.toggle("bad",!ok);tries++;
      if(ok){fb.textContent="Goed!";fb.className="fb ok";if(!scored&&tries===1)sc.hit();scored=true}
      else{fb.innerHTML=tries>=2?`Goed is: <b>${a}</b>`:"Nog niet goed. Probeer het nog een keer.";fb.className="fb bad"}};
    b.onclick=check;inp.addEventListener("keydown",e=>{if(e.key==="Enter")check()});
    row.appendChild(inp);row.appendChild(b);q.appendChild(row);q.appendChild(fb);box.appendChild(q);
  });
}

/* ---------- zou ---------- */
function buildZou(root){
  root.innerHTML=`<h2>Zou + infinitief</h2><p class="intro">Met zou vraag je iets extra beleefd. Perfect voor een formele mail. <i>zou = would</i></p>
  <div class="rule"><b>ik / jij / u / hij / zij zou · wij / jullie / zij zouden</b><br>Zou op plek 2 (of 1 in een vraag), de infinitief aan het eind. Twee infinitieven? Eerst kunnen/willen/mogen: <i>Ik zou graag een afspraak <b>willen maken</b>. Zou u mij <b>kunnen helpen</b>?</i><br>Portugees: <i>Eu gostaria de…</i> = Ik zou graag … willen · <i>O senhor poderia…?</i> = Zou u … kunnen?</div>
  <h3>Deel 1 · Welke zin is goed?</h3>`;
  const sc=scoreLine(root,"zou",ZOUMC.length);const box=el("div",{class:"box"});root.appendChild(box);
  ZOUMC.forEach(it=>{
    const q=el("div",{class:"q"});q.appendChild(el("div",{class:"p"},`<b>${it.p}</b>`));
    const o=el("div");let answered=false,first=true;
    shuffle(it.o.map((t,k)=>[t,k])).forEach(([t,k])=>{const b=el("button",{class:"choice"},t);b.onclick=()=>{if(answered)return;const ok=k===it.a;b.classList.add(ok?"ok":"bad");if(ok){answered=true;if(first)sc.hit()}first=false};o.appendChild(b)});
    q.appendChild(o);box.appendChild(q);
  });
  root.appendChild(el("h3",{},"Deel 2 · Bouw de zin"));
  const sub=el("div");root.appendChild(sub);
  buildTiles(sub,"zou-zinnen",TILES_ZOU,null,null,null);
}

/* ---------- tiles ---------- */
function buildTiles(root,id,data,title,intro,rule){
  let order=shuffle(data.map((_,k)=>k)),i=0,good=0,checked=false;
  root.innerHTML=(title?`<h2>${title}</h2><p class="intro">${intro}</p>${rule?`<div class="rule">${rule}</div>`:""}`:"")+`
  <div class="box"><div class="row" style="justify-content:space-between"><span class="tag" data-r="tag"></span><span class="score" data-r="score"></span></div>
  <div class="slot" data-r="slot"></div><div class="pool" data-r="pool"></div><div class="fb" data-r="fb"></div>
  <div class="row" style="margin-top:10px"><button class="btn" data-r="check">Controleer</button><button class="btn alt" data-r="next">Volgende zin</button></div></div>`;
  const $=k=>root.querySelector(`[data-r="${k}"]`);
  const slot=$("slot"),pool=$("pool"),fb=$("fb");
  const render=()=>{
    if(i>=order.length){order=shuffle(order);i=0}
    const it=data[order[i]];checked=false;slot.innerHTML="";pool.innerHTML="";fb.textContent="";fb.className="fb";
    $("tag").textContent=it.t;$("score").textContent=`${good} van ${data.length} goed`;
    let words=shuffle(it.w);let tries=0;while(words.join(" ")===it.w.join(" ")&&tries++<10)words=shuffle(it.w);
    words.forEach(w=>{const b=el("button",{class:"tile"},w);b.onclick=()=>{(b.parentNode===pool?slot:pool).appendChild(b)};pool.appendChild(b)});
  };
  $("check").onclick=()=>{
    const it=data[order[i]];
    if(pool.children.length){fb.textContent="Gebruik alle stukjes.";fb.className="fb bad";return}
    const built=[...slot.children].map(b=>b.textContent).join(" ");
    const ok=[it.s,...(it.alt||[])].some(s=>norm(s)===norm(built));
    if(ok){fb.textContent="Goed! "+it.s;fb.className="fb ok";if(!checked){good++;saveBest(id.startsWith("zou")?"zou":id,good,data.length)}}
    else{fb.innerHTML="Nog niet goed. Goed is: <b>"+it.s+"</b>";fb.className="fb bad"}
    checked=true;$("score").textContent=`${good} van ${data.length} goed`;
  };
  $("next").onclick=()=>{i++;render()};
  render();
}
show();
</script>
